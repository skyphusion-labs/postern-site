# postern-site: a static-assets-only Worker. No Worker script, no bindings, no build step.
# Everything served is in ./site.
name = "postern-site"
compatibility_date = "2026-10-01"

# workers.dev and preview URLs stay off. Since 0.2.0 (Conrad, 2026-11-10: "let's switch
# to it") the site serves the posternonline.com apex and www, and site-mode.json has
# "preview": false, so pages are indexable. The demo mailbox stays on
# demo.posternonline.com (its own Worker, `postern`). The 0.1.x preview host
# next.posternonline.com is retired. To stage a future redesign, add a preview host back
# and run `node scripts/set-preview.mjs on` for that build only.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "posternonline.com", custom_domain = true },
  { pattern = "www.posternonline.com", custom_domain = true },
]

[assets]
directory = "./site"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# The privacy page says Worker logs are off for this site. Keep this false, or change
# that page in the same PR.
[observability]
enabled = false
