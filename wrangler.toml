# postern-site: a static-assets-only Worker. No Worker script, no bindings, no build step.
# Everything served is in ./site.
name = "postern-site"
compatibility_date = "2026-10-01"

# workers.dev and preview URLs stay off. The ONE route is the preview host
# next.posternonline.com (0.1.0), which Conrad opens to review the site. While it is the
# only route, site-mode.json keeps "preview": true, so every page is noindex and
# robots.txt disallows everything.
# The posternonline.com apex and www still 301 to the demo and are NOT routed here. The
# cutover is Conrad's call; when it happens, add the apex and www routes and run
# `node scripts/set-preview.mjs off` in the same PR.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "next.posternonline.com", custom_domain = true },
]

[assets]
directory = "./site"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# The privacy page says Worker logs are off for this site. Keep this false, or change
# that page in the same PR.
[observability]
enabled = false
